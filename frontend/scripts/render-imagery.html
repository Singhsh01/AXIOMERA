<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
const P = new URLSearchParams(location.search);
const W = +P.get("w") || 2400, H = +P.get("h") || 1500, which = P.get("s") || "hero";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(P.get("exp") || 1.0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const mat = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const box = (w, h, d, m, x, y, z, ry = 0) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); o.rotation.y = ry; o.castShadow = o.receiveShadow = true; scene.add(o); return o;
};
function sky(top, bottom) {
  const c = document.createElement("canvas"); c.width = 2; c.height = 512;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
function sweep(c, near, far) { scene.background = new THREE.Color(c); scene.fog = new THREE.Fog(c, near, far); }
function sun(color, intensity, pos, size = 60) {
  const s = new THREE.DirectionalLight(color, intensity); s.position.set(...pos); s.castShadow = true;
  s.shadow.mapSize.set(4096, 4096); s.shadow.bias = -0.0004; s.shadow.normalBias = 0.02;
  const c = s.shadow.camera; c.left = -size; c.right = size; c.top = size; c.bottom = -size; c.near = 1; c.far = 400;
  scene.add(s); return s;
}
let camera;

if (which === "hero") {
  // Stepped, cantilevered massing in the manner of an architect's white study model.
  sweep("#ECE4D7", 120, 260);
  scene.add(new THREE.HemisphereLight("#FFF8EF", "#D9CCB8", 1.35));
  sun("#FFDDB8", 3.6, [-46, 52, 34], 60);
  const ivory = mat("#F1EBE1"), shade = mat("#E7DFD2"), glass = mat("#5A4E42", 0.2, 0.4), bronze = mat("#8C6A45", 0.45, 0.5);
  box(800, 0.2, 800, mat("#E6DDCF", 1), 0, -0.1, 0);
  box(46, 1.2, 30, shade, 0, 0.6, 0);                                     // plinth
  const levels = [[34, 18, 0, 0], [40, 16, 5, -2], [30, 20, -6, 3], [44, 12, 9, -1], [26, 14, -3, 1]];
  levels.forEach(([w, d, x, z], i) => {
    const y = 1.2 + i * 3.4;
    box(w, 0.6, d, ivory, x, y + 3.1, z);                                 // slab
    box(w - 2, 2.8, d - 2, glass, x, y + 1.4, z);                         // recessed glazing
    for (let k = -w / 2 + 1.2; k <= w / 2 - 1.2; k += 1.6) box(0.22, 2.8, 0.9, ivory, x + k, y + 1.4, z + d / 2 - 0.6);
    for (let k = -d / 2 + 1.2; k <= d / 2 - 1.2; k += 1.6) box(0.9, 2.8, 0.22, ivory, x + w / 2 - 0.6, y + 1.4, z + k);
  });
  box(1.2, 18, 1.2, bronze, -14, 9, 9);                                   // one bronze mast
  camera = new THREE.PerspectiveCamera(P.get("cam") === "detail" ? 16 : 26, W / H, 1, 600);
  if (P.get("cam") === "detail") { camera.position.set(40, 14, 60); camera.lookAt(6, 9, 4); }
  else { camera.position.set(66, 30, 72); camera.lookAt(-16, 7, -4); }
}

if (which === "portal") {
  // Colonnade under a single long lintel; shadows stripe the floor. One-point perspective.
  sweep("#EFE8DC", 40, 150);
  scene.add(new THREE.HemisphereLight("#FFF7EC", "#E3D6C2", 1.5));
  sun("#FFD7AA", 3.4, [44, 26, -10], 60);
  const ivory = mat("#F0E9DD"), floor = mat("#DED2BF", 0.95);
  box(300, 0.2, 300, floor, 0, -0.1, 0);
  for (let z = 8; z >= -90; z -= 6) { box(1.1, 12, 1.1, ivory, -6, 6, z); box(1.1, 12, 1.1, ivory, 6, 6, z); }
  box(13.5, 1.4, 104, ivory, 0, 12.7, -41);
  box(2.8, 0.06, 104, mat("#A68461", 0.55, 0.3), 0, 0.03, -41);   // bronze inlay down the axis
  camera = new THREE.PerspectiveCamera(38, W / H, 0.5, 400);
  camera.position.set(0, 5.2, 22); camera.lookAt(0, 5.4, -40);
}

if (which === "grid") {
  // Field of blocks of varying heights seen from above: a structure of many coordinated parts.
  sweep("#EAE2D5", 90, 220);
  scene.add(new THREE.HemisphereLight("#FFF7EC", "#BCA98E", 1.0));
  sun("#FFDDB5", 3.2, [-40, 60, 30], 70);
  box(800, 0.2, 800, mat("#E4DACA", 1), 0, -0.1, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tones = ["#EFE8DC", "#E6DCCB", "#F3EEE5", "#DCCFBB"];
  for (let x = -11; x <= 11; x++) for (let z = -8; z <= 8; z++) {
    if (rnd() < 0.18) continue;
    const h = 0.4 + Math.pow(rnd(), 2.2) * 9;
    const accent = rnd() < 0.03;
    box(2.6, h, 2.6, accent ? mat("#9C7B57", 0.5, 0.35) : mat(tones[(x + z + 40) % 4]), x * 3.2, h / 2, z * 3.2);
  }
  camera = new THREE.PerspectiveCamera(32, W / H, 1, 500);
  camera.position.set(34, 52, 58); camera.lookAt(0, 0, 0);
}

if (which === "dusk") {
  // A cantilevered volume over a plinth at dusk; one warm band of interior light.
  sky("#2A2621", "#6B5A49"); scene.fog = new THREE.Fog("#3B342C", 50, 170);
  scene.add(new THREE.HemisphereLight("#8C7A66", "#1C1916", 0.55));
  sun("#FFD6B0", 0.9, [-50, 14, 30], 70);
  scene.add(new THREE.AmbientLight("#A89A88", 0.35));
  const conc = mat("#A49B8E", 0.95), dark = mat("#1E1C1A", 0.4, 0.2);
  box(300, 0.2, 300, mat("#4A4239", 1), 0, -0.1, 0);
  box(40, 3, 18, conc, 6, 1.5, 0);                     // plinth
  box(64, 6.5, 14, conc, -10, 8.2, 1);                 // cantilever
  box(62, 2.2, 0.15, dark, -10, 8.2, 8.05);
  const glow = new THREE.Mesh(new THREE.BoxGeometry(60, 1.6, 0.1), new THREE.MeshStandardMaterial({ color: "#FFC88A", emissive: "#FFB060", emissiveIntensity: 2.4 }));
  glow.position.set(-10, 8.2, 8.12); scene.add(glow);
  for (let i = -39; i <= 19; i += 3) box(0.18, 2.2, 0.3, dark, i, 8.2, 8.2);
  const pl = new THREE.PointLight("#FFB566", 60, 40, 1.6); pl.position.set(-10, 6, 12); scene.add(pl);
  camera = new THREE.PerspectiveCamera(30, W / H, 0.5, 500);
  camera.position.set(-58, 6, 52); camera.lookAt(-6, 7, 0);
}

const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
if (!P.get("noao")) {
  const ao = new GTAOPass(scene, camera, W, H);
  ao.updateGtaoMaterial({ radius: +(P.get("aor") || 1.6), distanceExponent: 1.4, thickness: 2, scale: 1.0, samples: 16 });
  ao.blendIntensity = +(P.get("aoi") || 0.9);
  composer.addPass(ao);
}
composer.addPass(new OutputPass());
composer.render();
window.__done = true;
</script>
</body></html>
