# Axiomera — local stack, sized for an Apple Silicon laptop with 8 GB RAM.
#
#   docker compose up -d --build                         core: postgres, redis, n8n, api (2 workers), web  (~2.3 GB)
#   docker compose --profile observability up -d         + OpenTelemetry collector, Jaeger, Prometheus
#
# n8n and the API bind to 127.0.0.1 only; the n8n editor is not exposed beyond this machine.
# Project name decides the volume names (database, n8n data, uploads). Installations created before the
# rename keep their data by setting COMPOSE_PROJECT_NAME=orkestr in .env (see docs/naming-audit.md).
name: axiomera

x-n8n-env: &n8n-env
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"     # workflows read AXIOMERA_* via $env
  NODE_FUNCTION_ALLOW_BUILTIN: "crypto"     # HMAC verification in Code nodes
  N8N_RUNNERS_ENABLED: "true"
  N8N_SECURE_COOKIE: "false"                # localhost only; enable behind TLS
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
  WEBHOOK_URL: http://localhost:5678/
  GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  AXIOMERA_API_URL: http://api:8000
  AXIOMERA_SERVICE_TOKEN: ${AXIOMERA_SERVICE_TOKEN:-dev-service-token}
  AXIOMERA_WEBHOOK_SECRET: ${AXIOMERA_WEBHOOK_SECRET:-dev-webhook-secret}
  # Legacy names for n8n executions that started under workflow versions from before the rename
  # (they resume with the code they started with). Safe to remove once no such execution is waiting.
  ORKESTR_API_URL: http://api:8000
  ORKESTR_SERVICE_TOKEN: ${AXIOMERA_SERVICE_TOKEN:-dev-service-token}
  ORKESTR_WEBHOOK_SECRET: ${AXIOMERA_WEBHOOK_SECRET:-dev-webhook-secret}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiomera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiomera}
      POSTGRES_DB: ${POSTGRES_DB:-axiomera}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=120"]
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]   # host port only for local tools; containers use postgres:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    mem_limit: 512m

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      AXIOMERA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-axiomera}:${POSTGRES_PASSWORD:-axiomera}@postgres:5432/${POSTGRES_DB:-axiomera}
      AXIOMERA_N8N_BASE_URL: http://n8n:5678
      AXIOMERA_CORS_ORIGINS: '["http://localhost:3000"]'
      AXIOMERA_OTEL_ENDPOINT: ${AXIOMERA_OTEL_ENDPOINT:-}
      AXIOMERA_REDIS_URL: redis://redis:6379/0        # shared cache + rate limits across workers
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}          # API worker processes (raise on bigger machines)
      AXIOMERA_DB_POOL_SIZE: ${AXIOMERA_DB_POOL_SIZE:-10}
    volumes:
      - ./n8n/workflows:/workflows:ro
      - storage:/data/storage
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    mem_limit: 96m

  n8n-init:
    image: ${N8N_IMAGE:-n8nio/n8n:1.123.92}
    environment: *n8n-env
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/bootstrap.sh:/bootstrap.sh:ro
    restart: "no"

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:1.123.92}
    environment: *n8n-env
    volumes: [n8ndata:/home/node/.n8n]
    ports: ["127.0.0.1:5678:5678"]
    depends_on:
      n8n-init: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    mem_limit: 1g

  web:
    build:
      context: ./frontend
      args: { AXIOMERA_API_URL: http://api:8000 }
    environment:
      AXIOMERA_API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 384m

  # ---------------------------------------------------------------- optional: observability
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.116.0
    command: ["--config=/etc/otel.yml"]
    volumes: [./infra/otel-collector.yml:/etc/otel.yml:ro]
    mem_limit: 256m

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.64.0
    ports: ["127.0.0.1:16686:16686"]
    mem_limit: 384m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m

volumes:
  pgdata:
  n8ndata:
  storage:
